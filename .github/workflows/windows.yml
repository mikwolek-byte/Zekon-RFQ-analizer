name: Zekon RFQ Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.16,<7"
      - name: Test extraction and calculations
        run: python -m unittest -v test_engine
      - name: Test source GUI
        run: python zekon_rfq.py --smoke-test source-startup.txt
      - name: Build standalone executable
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name Zekon_RFQ --collect-all tkinterdnd2 zekon_rfq.py
      - name: Test executable GUI startup
        shell: pwsh
        run: |
          $marker = Join-Path $PWD 'exe-startup.txt'
          $process = Start-Process -FilePath '.\dist\Zekon_RFQ.exe' -ArgumentList "--smoke-test `"$marker`"" -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'EXE startup timed out' }
          if ($process.ExitCode -ne 0) { throw "EXE exit code: $($process.ExitCode)" }
          if (-not (Test-Path $marker)) { throw 'GUI startup marker missing' }
          Get-Content $marker
          (Get-FileHash '.\dist\Zekon_RFQ.exe' -Algorithm SHA256).Hash | Set-Content '.\dist\SHA256.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: Zekon_RFQ_Windows
          path: |
            dist/Zekon_RFQ.exe
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30
